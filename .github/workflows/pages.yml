# Publishes the browser-only demo to GitHub Pages, so it appears under the repo's Deployments
# (environment "github-pages"). Pull requests only run the tests (including the browser tests) and the
# build; main also deploys, once both have passed.
name: Demo on GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; let a running one finish.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:demo
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  # The browser tests (test/callout-browser.test.js and test/lobby-browser.test.js) need Node 22+ and Chrome, so `npm test` in the
  # build job (Node 20) skips them. Here they must run: DERBY_BROWSER_TESTS=required fails them instead
  # of skipping, and the last step checks that every one of them ran and passed. The runner has no GPU:
  # Chrome draws with software WebGL, and the live match runs on the test's stepped clock (60 frames a
  # second of match time, however slowly they draw). The files run one at a time: two Chromes at once on
  # the runner's few cores slow both past their time limits.
  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Browser tests in headless Chrome
        env:
          DERBY_BROWSER_TESTS: required
        run: >-
          node --test
          --test-concurrency=1
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=tap --test-reporter-destination=browser.tap
          test/callout-browser.test.js
          test/lobby-browser.test.js
      - name: Check that every browser test ran
        run: |
          tests=$(sed -n 's/^# tests //p' browser.tap)
          pass=$(sed -n 's/^# pass //p' browser.tap)
          echo "$pass of $tests browser tests passed"
          [ "$tests" -ge 7 ] && [ "$pass" = "$tests" ]

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
